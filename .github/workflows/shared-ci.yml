name: Shared Library CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/shared/**"
      - ".github/workflows/shared-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/shared/**"

jobs:
  shared-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install fastapi pydantic pytest pytest-asyncio

      - name: Shared Library 테스트
        working-directory: services
        run: pytest -q shared/tests/ -v
