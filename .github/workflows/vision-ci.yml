name: Vision CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "services/vision/**"
      - "services/shared/**"
      - ".github/workflows/vision-ci.yml"
  push:
    branches: [main]
    paths:
      - "services/vision/**"
      - "services/shared/**"
      - ".github/workflows/vision-ci.yml"

jobs:
  vision-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: insolvency_os
          POSTGRES_USER: arkos
          POSTGRES_PASSWORD: arkos
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U arkos"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 의존성 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r services/vision/requirements.txt

      - name: 타입 검사 (import 검증)
        working-directory: services/vision
        run: python -c "import app.main; print('Vision import OK')"
        env:
          DATABASE_URL: "postgresql+asyncpg://arkos:arkos@127.0.0.1:5432/insolvency_os"

      - name: 단위 테스트
        working-directory: services/vision
        run: pytest -q tests/ --timeout=60 || echo "No tests found (OK for initial CI)"
        env:
          DATABASE_URL: "postgresql+asyncpg://arkos:arkos@127.0.0.1:5432/insolvency_os"
