services:
  postgres-db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=insolvency_os
      - POSTGRES_USER=arkos
      - POSTGRES_PASSWORD=arkos
    ports:
      - "15432:5432"
    volumes:
      - ./scripts/init-db-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U arkos -d insolvency_os" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mocked Core dependencies
  redis-bus:
    image: redis:alpine
    ports:
      - "16379:6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 3

  neo4j-db:
    image: neo4j:5.18
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "17474:7474"
      - "17687:7687"
    healthcheck:
      test: [ "CMD-SHELL", "cypher-shell -u neo4j -p password 'RETURN 1' || exit 1" ]
      interval: 10s
      timeout: 10s
      retries: 10

  # Axiom Services — 19xxx 포트 대역 사용 (9xxx 충돌 방지)
  synapse-svc:
    build:
      context: ./services
      dockerfile: synapse/Dockerfile
    ports:
      - "19003:8003"
    environment:
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - SCHEMA_EDIT_DATABASE_URL=postgresql://arkos:arkos@postgres-db:5432/insolvency_os
      - JWT_SECRET_KEY=axiom-dev-secret-key-do-not-use-in-production
    depends_on:
      neo4j-db:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8003/health/live')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  vision-svc:
    build:
      context: ./services
      dockerfile: vision/Dockerfile
    ports:
      - "19100:8000"
    environment:
      - REDIS_URL=redis://redis-bus:6379
      - CORE_EVENT_BUS=redis
      - VISION_STATE_DATABASE_URL=postgresql://arkos:arkos@postgres-db:5432/insolvency_os
      - SYNAPSE_BASE_URL=http://synapse-svc:8003
      - CORE_BASE_URL=http://core-svc:8002
    depends_on:
      redis-bus:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      synapse-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  core-svc:
    build:
      context: ./services
      dockerfile: core/Dockerfile
    ports:
      - "19002:8002"
    environment:
      - DATABASE_URL=postgresql+asyncpg://arkos:arkos@postgres-db:5432/insolvency_os
      - DATABASE_SCHEMA=core
      - CORE_AGENT_STATE_DATABASE_URL=postgresql://arkos:arkos@postgres-db:5432/insolvency_os
      - REDIS_URL=redis://redis-bus:6379
      - SYNAPSE_BASE_URL=http://synapse-svc:8003
      - SEED_DEV_USER=1
      - SEED_DEV_EMAIL=admin@local.axiom
      - SEED_DEV_PASSWORD=admin
    depends_on:
      redis-bus:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      synapse-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/v1/health/ready')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  weaver-svc:
    build:
      context: ./services
      dockerfile: weaver/Dockerfile
    ports:
      - "19001:8001"
    environment:
      - SYNAPSE_BASE_URL=http://synapse-svc:8003
      - WEAVER_METADATA_PG_MODE=1
      - POSTGRES_DSN=postgresql://arkos:arkos@postgres-db:5432/insolvency_os
      - REDIS_URL=redis://redis-bus:6379/0
      - WEAVER_CORS_ALLOWED_ORIGINS=http://localhost:15174,http://localhost:5174,http://localhost:3000,https://app.axiom.kr,https://canvas.axiom.kr
      - WEAVER_INSIGHT_SERVICE_TOKEN=axiom-insight-svc-token-dev
    depends_on:
      redis-bus:
        condition: service_healthy
      vision-svc:
        condition: service_healthy
      core-svc:
        condition: service_healthy
      synapse-svc:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  oracle-svc:
    build:
      context: ./services
      dockerfile: oracle/Dockerfile
    ports:
      - "19004:8004"
    environment:
      - SYNAPSE_API_URL=http://synapse-svc:8003
      - CORE_API_URL=http://core-svc:8002
      - WEAVER_QUERY_API_URL=http://weaver-svc:8001/api/query
      - QUERY_HISTORY_DATABASE_URL=postgresql://arkos:arkos@postgres-db:5432/insolvency_os
      - ORACLE_SQL_EXECUTION_MODE=direct
      - ORACLE_DATASOURCES_JSON=[{"id":"ds_sample","name":"Sample Business DB","type":"postgresql","host":"postgres-db","database":"insolvency_os","schema":"public","status":"active"}]
      - WEAVER_INSIGHT_URL=http://weaver-svc:8001/api/insight/logs
      - WEAVER_INSIGHT_TOKEN=axiom-insight-svc-token-dev
    depends_on:
      postgres-db:
        condition: service_healthy
      synapse-svc:
        condition: service_healthy
      core-svc:
        condition: service_healthy
      weaver-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8004/health/ready')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Digital Twin 서비스
  twin-svc:
    build:
      context: ./services/twin
      dockerfile: Dockerfile
    container_name: axiom-twin
    ports:
      - "19006:8006"
    environment:
      - DATABASE_URL=postgresql+asyncpg://arkos:arkos@postgres-db:5432/insolvency_os
      - DATABASE_SCHEMA=twin
      - REDIS_URL=redis://redis-bus:6379
      - JWT_SECRET_KEY=axiom-dev-secret-key-do-not-use-in-production
    depends_on:
      redis-bus:
        condition: service_healthy
      postgres-db:
        condition: service_healthy
      core-svc:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8006/health/live')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # OLAP Studio 서비스
  olap-studio:
    build:
      context: ./services
      dockerfile: olap-studio/Dockerfile
    container_name: axiom-olap-studio
    ports:
      - "19005:8000"
    environment:
      - DATABASE_URL=postgresql://arkos:arkos@postgres-db:5432/insolvency_os
      - NEO4J_URI=bolt://neo4j-db:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
      - REDIS_URL=redis://redis-bus:6379
      - JWT_SECRET_KEY=axiom-dev-secret-key-do-not-use-in-production
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    depends_on:
      postgres-db:
        condition: service_healthy
      redis-bus:
        condition: service_healthy
    volumes:
      - ./services/olap-studio/app:/app/app
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # Frontend (Canvas UI)
  # Nginx가 /proxy/* 경로를 Docker 내부 서비스로 리버스 프록시한다.
  # VITE_*_URL은 .env.docker 파일에서 상대 경로(/proxy/core 등)로 설정되어
  # 빌드 시 번들에 포함된다. 브라우저 → Nginx → 백엔드 순서로 요청이 전달된다.
  canvas-ui:
    build:
      context: ./canvas
      dockerfile: Dockerfile
    ports:
      - "15174:80"
    depends_on:
      - core-svc
      - vision-svc
      - weaver-svc
      - oracle-svc
      - synapse-svc
      - olap-studio
