# -----------------------------------------------------------------------
# Axiom Canvas — Nginx reverse proxy + SPA 설정
#
# Vite 개발 서버의 proxy 규칙을 동일하게 재현하여,
# 프론트엔드 코드가 /proxy/core, /proxy/weaver 등 상대 경로를
# 개발(Vite)과 프로덕션(Nginx) 환경 모두에서 동일하게 사용할 수 있도록 한다.
#
# 백엔드 서비스는 Docker 네트워크 내부 이름으로 접근한다.
# (core-svc:8002, weaver-svc:8001, oracle-svc:8004, synapse-svc:8003,
#  vision-svc:8000, olap-studio:8000)
# -----------------------------------------------------------------------

# upstream 정의 — 이름으로 한눈에 식별
upstream core_backend       { server core-svc:8002; }
upstream weaver_backend     { server weaver-svc:8001; }
upstream oracle_backend     { server oracle-svc:8004; }
upstream synapse_backend    { server synapse-svc:8003; }
upstream vision_backend     { server vision-svc:8000; }
upstream olap_studio_backend { server olap-studio:8000; }

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # 공통 프록시 헤더 (모든 location에서 재사용)
    proxy_http_version 1.1;

    # ─── API 역방향 프록시 ───────────────────────────────────
    # Vite dev proxy 규칙을 그대로 재현:
    #   /proxy/core/*    → core-svc:8002/*
    #   /proxy/weaver/*  → weaver-svc:8001/*
    #   /proxy/oracle/*  → oracle-svc:8004/*
    #   /proxy/synapse/* → synapse-svc:8003/*
    #   /proxy/vision/*  → vision-svc:8000/*
    #   /api/gateway/olap/* → olap-studio:8000/*

    location /proxy/core/ {
        proxy_pass http://core_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 지원 (watches/stream)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /proxy/weaver/ {
        proxy_pass http://weaver_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 지원 (extract-metadata 등)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        # 대용량 파일 업로드 허용
        client_max_body_size 100m;
    }

    location /proxy/oracle/ {
        proxy_pass http://oracle_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # NDJSON 스트림 지원 (react 엔드포인트)
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location /proxy/synapse/ {
        proxy_pass http://synapse_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /proxy/vision/ {
        proxy_pass http://vision_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # OLAP Studio Gateway 프록시 — Vite와 동일 경로
    location /api/gateway/olap/ {
        proxy_pass http://olap_studio_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # ─── 정적 자산 ───────────────────────────────────────────

    # 해시된 자산 — 장기 캐시
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML — SPA 폴백 (캐시 없음, 항상 최신 fetch)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
