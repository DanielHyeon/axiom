spring:
  application:
    name: axiom-process-twin
  r2dbc:
    url: r2dbc:postgresql://localhost:5432/axiom
    username: axiom
    password: axiom
  datasource:
    url: jdbc:postgresql://localhost:5432/axiom
    username: axiom
    password: axiom
  flyway:
    enabled: true
    locations: classpath:db/migration
  neo4j:
    uri: bolt://localhost:7687
    authentication:
      username: neo4j
      password: neo4j-password

server:
  port: 8080

axiom:
  tenant:
    header-name: X-Tenant-Id
    org-unit-header-name: X-Org-Unit-Id
    workspace-header-name: X-Workspace-Id
